<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Peril Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Karla:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single night-campus stage — portrait left, conversation right, peril meter on test days; menus as chalkboard panels. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#14111c; --panel:#1f1a2b; --panel-2:#2a2338; --line:#3b3250;
  --fg:#efe8dc; --muted:#a99fb8; --accent:#ff7a3d; --accent-2:#ffb36b;
  --cold:#6cc6e8; --good:#7fd89a; --bad:#ff5d6c;
  --display:"Rozha One",Georgia,"Times New Roman",serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1}
.brand span{color:var(--accent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
button,input[type=text],select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);padding:8px 14px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#1a0f08;font-weight:700}
button.primary:hover{background:var(--accent-2)}
button[disabled]{opacity:.45;cursor:not-allowed}
nav.tabs button[aria-current="true"]{border-color:var(--accent);color:var(--accent-2)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,32px);line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
p{margin:0}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}

/* day */
.periods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.period{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;text-align:left;align-items:start;color:var(--fg)}
.period .mini svg,.period .mini img{width:52px;height:62px;border-radius:6px;display:block;object-fit:cover}
.period .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.period .subj{font-weight:700}
.period .who{font-size:13px;color:var(--muted)}
.period.test{border-color:var(--accent)}
.period.done{opacity:.6}
.period.gone{opacity:.35}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);align-self:flex-start}
.chip.test{border-color:var(--accent);color:var(--accent-2)}
.chip.saved{border-color:var(--good);color:var(--good)}
.chip.lost{border-color:var(--bad);color:var(--bad)}
.term{overflow-x:auto}
.term table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
.term th,.term td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.term th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.term td.now{color:var(--accent-2)}
.cal{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.cal table{min-width:1100px}
.cal thead th{position:sticky;top:0;background:var(--panel);z-index:1}
.cal td,.cal th{white-space:normal;vertical-align:top}
.cal td:first-child,.cal th:first-child{position:sticky;left:0;background:var(--panel);white-space:nowrap;z-index:2}
.cal tr.today td{background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.cal tr.past td{opacity:.55}
.cal .tcell{min-width:120px}
.cal .tcell b{display:block;font-size:12px;color:var(--accent-2)}
.cal .tcell span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.cal .tcell.saved b{color:var(--good)}.cal .tcell.lost b{color:var(--bad)}

/* stage */
.stage{position:relative;background:radial-gradient(ellipse at 30% 20%,var(--scene,#3a2a55) 0%,var(--panel) 60%);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:460px;display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr)}
@media (max-width:720px){.stage{grid-template-columns:1fr}}
.stage .portrait{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px}
.stage .portrait svg,.stage .portrait img{width:100%;max-width:230px;height:auto;border-radius:12px;display:block}
.stage .portrait img{aspect-ratio:5/6;object-fit:cover}
.stage .portrait .nm{font-family:var(--display);font-size:19px;text-align:center}
@media (max-width:720px){.stage .portrait{padding:16px 16px 0;flex-direction:row;justify-content:flex-start}.stage .portrait svg,.stage .portrait img{max-width:90px}}
.stage .right{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:20px;min-width:0}
.scene-tag{font-family:var(--mono);font-size:12px;color:var(--accent-2);letter-spacing:.06em;text-transform:uppercase}
.box{background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-height:140px;display:flex;flex-direction:column;gap:10px}
.speaker{font-family:var(--display);font-size:20px;color:var(--accent-2)}
.speaker.narr{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.line{max-width:64ch}
.eq{font-family:var(--mono);font-size:14px;background:var(--panel-2);padding:1px 6px;border-radius:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.progress{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}

/* chat */
.chat{max-height:min(52vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.t{background:var(--panel-2);border:1px solid var(--line);align-self:flex-start}
.msg.u{background:color-mix(in srgb,var(--cold) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--cold) 40%,var(--line));align-self:flex-end}
.msg .who{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted)}

/* peril */
.peril{display:flex;flex-direction:column;gap:6px}
.meter{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--bad));transition:width .4s}
.timer{height:4px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cold);transition:width .25s linear}
.q{font-weight:700;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opts button{text-align:left;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel-2))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel-2))}
.explain{font-size:14px;color:var(--muted)}
.track{position:relative;height:56px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;right:0;width:16%;background:color-mix(in srgb,var(--good) 25%,transparent);border-left:2px dashed var(--good)}
.track .runner{position:absolute;top:10px;width:34px;height:34px;border-radius:50%;background:var(--accent);left:0}
.bigcount{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.card .pic svg,.card .pic img{width:96px;height:115px;border-radius:8px;display:block;object-fit:cover}
.card .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.card .desc{font-size:14px;color:var(--muted)}
.hearts{font-family:var(--mono);font-size:13px;color:var(--accent-2)}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.card .row button{font-size:13px;padding:5px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.note{font-size:14px;color:var(--muted)}
.status{font-family:var(--mono);font-size:13px;color:var(--accent-2)}
.flash-bad{animation:fb .6s}
.doom{animation:doomshake .7s ease-out;}
.doom::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,color-mix(in srgb,var(--bad) 55%,transparent) 100%);animation:doomglow 2.4s ease-out forwards}
@keyframes doomshake{0%,100%{transform:translate(0)}15%{transform:translate(-8px,4px)}30%{transform:translate(7px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes doomglow{0%{opacity:1}100%{opacity:.25}}
.strike{font-style:italic;color:var(--accent-2);font-size:15px}
@keyframes fb{0%{box-shadow:0 0 0 0 var(--bad) inset}50%{box-shadow:0 0 0 6px var(--bad) inset}100%{box-shadow:0 0 0 0 transparent inset}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html{-webkit-text-size-adjust:100%}
/* Phone layout (iPhone 17 Pro is about 402 px wide) */
@media (max-width:480px){
  body{padding-block:10px 24px;font-size:16px}
  .wrap{gap:14px}
  header.top{gap:8px;padding-bottom:8px}
  .brand{font-size:28px}
  .stats{gap:10px;font-size:12px;width:100%}
  nav.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  nav.tabs button{padding:10px 4px;font-size:14px}
  button{min-height:44px}
  .panel{padding:14px}
  h2{font-size:23px}
  .periods{grid-template-columns:1fr;gap:8px}
  .period{padding:10px;grid-template-columns:44px minmax(0,1fr)}
  .period .mini svg,.period .mini img{width:44px;height:53px}
  .stage{min-height:0;border-radius:12px}
  .stage .portrait{padding:10px 12px 0;gap:10px;align-items:center}
  .stage .portrait svg,.stage .portrait img{max-width:64px}
  .stage .portrait .nm{font-size:17px;text-align:left}
  .stage .right{padding:12px;gap:10px}
  .box{padding:12px;min-height:0}
  .chat{max-height:calc(100dvh - 330px);min-height:240px}
  .msg{max-width:94%;padding:9px 12px}
  .compose button{padding:8px 12px}
  .controls{gap:6px}
  .controls button{flex:1 1 auto}
  .q{font-size:16px}
  .card{grid-template-columns:72px minmax(0,1fr);gap:10px;padding:12px}
  .card .pic svg,.card .pic img{width:72px;height:86px}
  .roster{grid-template-columns:1fr}
  .bigcount{font-size:36px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Peril <span>Academy</span></div>
    <div class="stats" id="stats"></div>
    <nav class="tabs" id="tabs">
      <button data-view="schedule" aria-current="true">Today</button>
      <button data-view="faculty">Faculty</button>
      <button data-view="hire">Hire from image</button>
      <button id="settingsBtn" title="AI settings">⚙</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
/* ---------------- Portrait renderer ---------------- */
function portrait(p){
  const s=p.skin,h=p.hair,t=p.top,bg=p.bg,shade=p.skinShade||s;
  let back="",front="",extra="";
  switch(p.style){
    case"braid":back=`<path d="M52 92 Q48 40 100 32 Q152 40 148 92 L150 170 L50 170 Z" fill="${h}"/>`;
      front=`<path d="M58 80 Q70 44 100 42 Q132 44 142 80 Q128 60 104 58 Q78 58 58 80Z" fill="${h}"/>`;
      extra=`<g fill="${h}"><ellipse cx="140" cy="150" rx="10" ry="12"/><ellipse cx="143" cy="172" rx="9" ry="11"/><ellipse cx="145" cy="192" rx="8" ry="10"/></g>`;break;
    case"bob":back=`<path d="M50 120 Q44 40 100 34 Q156 40 150 120 Q140 132 128 126 L72 126 Q60 132 50 120Z" fill="${h}"/>`;
      front=`<path d="M60 82 Q64 46 100 42 Q136 46 140 82 L140 70 Q120 66 112 58 Q96 72 60 74Z" fill="${h}"/>`;break;
    case"wavy":back=`<path d="M44 100 Q38 36 100 30 Q162 36 156 100 Q166 140 150 176 L50 176 Q34 140 44 100Z" fill="${h}"/>`;
      front=`<path d="M56 84 Q60 44 100 40 Q140 44 146 86 Q132 62 108 56 Q80 58 56 84Z" fill="${h}"/>`;break;
    case"puff":back=`<circle cx="100" cy="34" r="40" fill="${h}"/>`;
      front=`<path d="M60 78 Q64 46 100 44 Q136 46 140 78 Q124 60 100 60 Q76 60 60 78Z" fill="${h}"/>`;break;
    case"pony":back=`<path d="M138 56 Q176 70 160 150 Q154 120 146 96Z" fill="${h}"/>`;
      front=`<path d="M58 84 Q60 42 100 38 Q140 42 142 84 Q130 58 100 56 Q72 58 58 84Z" fill="${h}"/>`;break;
    case"long":back=`<path d="M52 100 Q46 38 100 32 Q154 38 148 100 L152 196 L48 196Z" fill="${h}"/>`;
      front=`<path d="M60 90 Q62 44 100 40 Q138 44 140 90 Q138 64 112 52 Q92 70 60 90Z" fill="${h}"/>`;break;
    case"bun":back=`<circle cx="100" cy="40" r="22" fill="${h}"/><path d="M58 96 Q54 46 100 42 Q146 46 142 96Z" fill="${h}"/>`;
      front=`<path d="M60 82 Q66 50 100 48 Q134 50 140 82 Q124 64 100 62 Q76 64 60 82Z" fill="${h}"/>`;break;
    default:back=`<path d="M50 110 Q44 40 100 34 Q156 40 150 110Z" fill="${h}"/>`;
      front=`<path d="M58 82 Q62 44 100 40 Q138 44 142 82 Q120 60 100 60 Q80 60 58 82Z" fill="${h}"/>`;
  }
  const coat=p.coat?`<path d="M30 240 L48 178 Q70 166 84 170 L96 240Z M170 240 L152 178 Q130 166 116 170 L104 240Z" fill="${p.coat}"/>`:"";
  const glasses=p.glasses?`<g fill="none" stroke="${p.glasses===true?"#2a2338":p.glasses}" stroke-width="2.5"><circle cx="86" cy="98" r="10"/><circle cx="114" cy="98" r="10"/><path d="M96 98h8"/></g>`:"";
  const ear=p.earrings?`<g fill="${p.earrings}"><circle cx="64" cy="116" r="5"/><circle cx="136" cy="116" r="5"/></g>`:"";
  const whistle=p.whistle?`<path d="M88 166 Q100 186 112 166" stroke="#d9d4cc" stroke-width="2" fill="none"/><rect x="104" y="182" width="14" height="8" rx="3" fill="#d9d4cc"/>`:"";
  const necklace=p.necklace?`<path d="M80 172 Q100 192 120 172" stroke="${p.necklace}" stroke-width="2" fill="none"/><circle cx="100" cy="186" r="3.5" fill="${p.necklace}"/>`:"";
  const freck=p.freckles?`<g fill="${shade}" opacity=".7"><circle cx="82" cy="110" r="1.4"/><circle cx="88" cy="113" r="1.2"/><circle cx="112" cy="113" r="1.2"/><circle cx="118" cy="110" r="1.4"/><circle cx="100" cy="112" r="1"/></g>`:"";
  return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.alt||"portrait"}">
  <defs><radialGradient id="g${p.id}${Math.random().toString(36).slice(2,6)}" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#14111c"/></radialGradient></defs>
  <rect width="200" height="240" fill="${bg}" opacity=".55"/><rect width="200" height="240" fill="#14111c" opacity=".25"/>
  ${back}
  <path d="M86 140 h28 v26 h-28z" fill="${shade}"/>
  <path d="M26 240 Q30 180 70 168 Q100 186 130 168 Q170 180 174 240Z" fill="${s}"/>
  <path d="M40 240 Q42 196 66 182 Q100 200 134 182 Q158 196 160 240Z" fill="${t}"/>
  ${p.halter?`<path d="M66 182 L92 160 M134 182 L108 160" stroke="${t}" stroke-width="6"/>`:""}
  ${coat}${whistle}${necklace}
  <ellipse cx="100" cy="100" rx="38" ry="46" fill="${s}"/>
  ${freck}
  <g fill="#1d1626"><ellipse cx="86" cy="99" rx="4" ry="4.6"/><ellipse cx="114" cy="99" rx="4" ry="4.6"/></g>
  <g fill="${p.eye||"#4a3524"}"><circle cx="86" cy="99" r="2.6"/><circle cx="114" cy="99" r="2.6"/></g>
  ${["flustered","amused","happy","proud"].includes(p.mood)?`<g fill="#e0607a" opacity="${p.mood==="flustered"?.45:.18}"><ellipse cx="78" cy="114" rx="9" ry="5"/><ellipse cx="122" cy="114" rx="9" ry="5"/></g>`:""}
  <path d="${({annoyed:"M78 86 Q86 88 94 91 M106 91 Q114 88 122 86",sad:"M78 90 Q86 84 94 86 M106 86 Q114 84 122 90",scared:"M78 84 Q86 78 94 84 M106 84 Q114 78 122 84",nervous:"M78 88 Q86 82 94 86 M106 86 Q114 82 122 88",focused:"M78 88 Q86 86 94 88 M106 88 Q114 86 122 88"})[p.mood]||"M78 88 Q86 84 94 88 M106 88 Q114 84 122 88"}" stroke="${p.brow||h}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M98 106 Q100 114 102 106" stroke="${shade}" stroke-width="2" fill="none"/>
  <path d="${({happy:"M88 122 Q100 136 112 122",proud:"M89 123 Q100 134 111 123",amused:"M90 125 Q102 132 112 121",flustered:"M93 125 Q100 129 107 125",nervous:"M90 126 Q95 123 100 126 Q105 129 110 126",annoyed:"M91 127 L109 125",sad:"M90 129 Q100 121 110 129",scared:"M95 124 Q100 133 105 124 Q100 121 95 124",focused:"M91 126 Q100 128 109 126"})[p.mood]||`M90 124 Q100 ${p.smile?132:128} 110 124`}" stroke="${p.lip||"#a3445a"}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  ${glasses}${ear}${front}${extra}
  </svg>`;
}

/* ---------------- Faculty ---------------- */
const TEACHERS={
 kaur:{name:"Dr. Vesna Kaur",subject:"Chemistry",room:"Lab C-4",age:34,
  look:"South Asian, warm brown skin, long black hair in a loose side braid, amber eyes, gold hoops.",
  outfit:"a black halter crop top and high-waisted charcoal trousers, leaving her midriff bare.",
  body:"Curvy and soft, with wide hips, a full bust and a softly toned stomach with a deep navel. The halter top leaves her shoulders and whole midriff bare, and its neckline dips enough to show a hint of cleavage; her high-waisted trousers hug her hips.",
  personality:"Precise, dry-witted, and fearless. She treats danger like a variable to be controlled and gets visibly delighted when a student reasons something out instead of memorizing it.",
  backstory:"Left a pharmaceutical lab after a safety cover-up. She swore her students would never learn to look away from consequences.",
  trap:"Suspended by a chain winch over a steel vat of boiling concentrated acid.",scene:"#284a1e",
  syllabus:["Acids, bases and the pH scale","Molarity, neutralization and buffers","Exam","Reaction rates and catalysts","Chemical equilibrium and Le Chatelier's principle","Oxidation and reduction","Electrochemistry and batteries","Thermochemistry and enthalpy","Organic functional groups","Polymers and plastics"],
  art:{id:"kaur",skin:"#b07850",skinShade:"#8f5d3d",hair:"#17121a",top:"#1b1820",bg:"#3c5a2a",style:"braid",earrings:"#e2b34a",halter:true,eye:"#b5772a",lip:"#8e3a45",alt:"Dr. Kaur"}},
 sato:{name:"Ms. Hana Sato",subject:"Calculus",room:"Hall 2B",age:24,
  look:"Japanese, fair skin, short teal-dyed bob with blunt bangs, round tortoiseshell glasses.",
  outfit:"a lavender cropped knit sweater, a pleated plaid skirt, and white sneakers.",
  body:"Petite and curvy, with a small waist and soft round cheeks. Her cropped sweater stops just above her navel and rides up whenever she reaches for the whiteboard, showing a strip of soft belly; her pleated skirt sways when she bounces on her toes.",
  personality:"Bubbly and fast-talking, with a competitive streak. She narrates math like a sports commentator and secretly keeps a notebook of every clever answer you give.",

  ["narr","The next morning the arena is raked smooth. Her gold earrings are found beside the post, one still hooked through the other. Lecture Hall A posts a single line on its door: 'Class dismissed.'"]]},
delgado:{strike:"The cage drops a foot with a bang and the bars start to glow orange. 'I'M FINE! KEEP RUNNING, ROOKIE!'",
 lose:[["narr","The second missed beep echoes through the fieldhouse. Above the trench, a release bolt fires with a crack."],
  ["delgado","*She grips the bars, sweat pouring, and finds you on the track. She's grinning, because of course she is.* 'Hey! Rookie! That was a hell of a run! Don't you dare stop running after this, okay? Dale!'"],
  ["narr","The cage drops. It hits the lava with a sound like a struck bell, and a fountain of fire bursts up to the rafters. The heat slams into you like a wall and the whole fieldhouse turns blinding orange. You throw an arm over your face and stumble back.","fx"],
  ["narr","When you can look again, there is only the glow of the trench, the black frame of the cage slowly sinking, and a smell of scorched iron and something worse that makes you gag."],
  ["narr","Her silver whistle sits on the bottom bleacher where she always tossed it before practice. The PACER recording keeps looping over the speakers, beep after beep after beep, until somebody finally pulls the plug."]]},
moreau:{strike:"The plank tilts with a groan, and Ms. Moreau slides a hand's width toward the edge. Below, long shapes rise just under the surface. 'Mon dieu,' she breathes. Then, with a shaky smile: 'Do not go gentle, chéri. Answer carefully.'",
 lose:[["narr","The plank's hinge gives way and it drops to a steep angle. Ms. Moreau slides to the very end and catches the lip with her fingertips."],
  ["moreau","*Her voice is soft and steady, as if she's reading aloud.* 'Shall I compare thee to a summer's day…' *She laughs, a little broken.* 'I never finished my poem about you. Finish it for me.'"],
  ["narr","Her fingers slip. Three crocodiles hit the same spot at once, rolling and thrashing, and the pool turns to churning white foam. The sound is enormous, and then, horribly fast, it is over.","fx"],
  ["narr","The ripples spread to the edges and come back, smaller each time. A red bloom spreads through the green water and slowly fades, until the pool is perfectly still and reflects the library's old stained glass."],
  ["narr","Her silver necklace hangs from a splinter at the end of the plank, turning slowly. Later, in her desk drawer, you find a single page in her handwriting with only a title on it: your name."]]},
haddad:{strike:"A vent grates open and a river of black ants pours across the chamber floor, rustling like dry paper. Dr. Haddad steps back with deliberate calm, pen still in hand. 'Interesting,' she says, but her voice has gone thin. 'My pulse is 140. Let's not find out what 200 looks like.'",
 lose:[["narr","Every vent in the chamber slams open at once. The ants come in a black flood, rising across the floor and up the glass like a tide."],
  ["haddad","*She presses her palm flat to the glass, right where you're standing, and for the first time you see real fear in her eyes.* 'So this is what it feels like,' she whispers. 'I always wondered.'"],
  ["narr","The glass goes dark, a seething, moving dark that blots out everything inside. You hear her clipboard hit the floor and one short scream before the dry roar of the colony drowns it. You stumble back from the glass and can't stop shaking.","fx"],
  ["narr","The observation lights flicker and die, and the roar goes on in the dark for what feels like hours."],
  ["narr","On the glass, right where her palm was, there's a smeared red handprint, slowly drying. When maintenance finally gasses the chamber and opens it, only her clipboard is left. Her last note breaks off mid-word: 'Subject remains remarkably calm under—'"]]},
solberg:{strike:"The conveyor lurches forward a full meter. The furnace mouth roars close enough that the air shimmers and loose strands of her hair lift in the heat. Prof. Solberg doesn't look at it. 'Radiant heat. Roughly eleven hundred degrees. Next answer. Correct, preferably.'",
 lose:[["narr","The conveyor's governor fails with a crack, and the belt surges toward the furnace at full speed."],
  ["solberg","*She turns her head to look at you through the shimmer, her glasses catching the orange light. She is almost calm.* 'Conservation of energy. Nothing is lost, only changed. It's the only comfort physics has. Remember it.'"],
  ["narr","The belt carries her into the furnace mouth. A white-hot flare bursts out with a roar that empties every thought from your head, and a wave of heat throws you to the floor. Sparks rain from the ceiling and every alarm in the foundry goes off at once.","fx"],
  ["narr","By the time the furnace is shut down and the roar fades to the slow tick of cooling metal, the foundry is thick with smoke and silence. One of the conveyor's leather straps is still buckled, torn loose at the end and blackened."],
  ["narr","Only her glasses remain, warped and fused to the edge of the conveyor. Somebody pries them loose and leaves them on her desk, on top of a page of derivation she never finished."]]}

const DOOM_EXTRA={
kaur:{pre:"For a second nothing happens. Then you notice it: a single link of the chain, already pitted from years of acid vapor, is stretching. A bead of condensation runs down it. The winch motor clicks, clicks, clicks, like it's trying to decide. Dr. Kaur hears it too. She closes her eyes and starts counting under her breath, the way she does when a reaction is about to turn.",
 after:"The next morning, Lab C-4 is sealed with yellow tape. Through the little window you can see her mug on the desk, the one shaped like a beaker, still half full of cold black coffee. Someone has taped a ghost pepper to the door. Nobody admits to it."},
sato:{pre:"The platform shudders. A hydraulic line under it starts to hiss, then spray, a thin fan of oil misting the air. Below, the fish go into a frenzy at the vibration, a silver tornado. Ms. Sato grips the rail with both hands and laughs, high and cracked. 'Okay! That's, um, a leak! That's a fun new variable!'",
 after:"The next morning there's a bowl of cat food on the steps of Hall 2B. Someone from the faculty is taking care of Integral. In the hallway, the arcade flyer she pinned up last week still says 'RHYTHM GAME NIGHT! SATO VS. EVERYONE!' in her loud handwriting, with your name added at the bottom in pen."},
brandt:{pre:"The rope groans. One by one, the strands at the pulley begin to pop, quiet as knuckles cracking. The dragons have stopped pretending not to care; all three are directly under her now, heads raised, still as statues. Dr. Brandt hums something under her breath, an old German song, and you realize she's trying to keep them calm. Or herself.",

okafor:{pre:"Deep in the gatehouse, gears grind. Dust sifts down from the iron teeth of the portcullis as it shudders upward an inch, then another. Behind it, the pacing stops. In the silence you can hear the torches crackle and her slow, deliberate breathing. She lifts her chin and starts reciting something in Latin, very quietly, like a prayer she doesn't believe in but likes the sound of.",
 after:"The next morning, her choir sings at the memorial in the empty arena. Her niece, seven years old, in a party dress because no one could get her to change, places a hand-drawn map of 'Auntie's Rome' at the foot of the post. Halfway through the hymn, one alto voice is missing, and the whole choir hears it."},
delgado:{pre:"Your legs are burning. The beeps are coming so fast they're almost one sound. Above the trench, the cage swings with every gust of heat, and you can hear her yelling your name, your laps, anything, hoarse and desperate. Then your foot lands half a step late. Then the next. Time stretches. You can see it happening and you can't make your body go faster.",
 after:"The next morning her phone, left in the fieldhouse office, rings at exactly 6:00. It rings until it goes to voicemail, and then it rings again. Nobody can bring themselves to answer her abuela. Somebody leaves a pair of salsa shoes on the bleachers next to the whistle."},
moreau:{pre:"The plank creaks and tilts another few degrees. Her slippers slide off her feet and drop into the water, and the surface erupts around them in a silent, instant explosion. She watches them vanish. Then she looks up at the stained glass above the pool and whispers a line of poetry you don't recognize, very calm, as if she's practicing.",
 after:"The next morning, the bakery under her flat leaves a single croissant on the Old Library's front steps, the way they do every morning for her. Her houseplants are already wilting. On the windowsill of her classroom, a poetry book is still open, face down, at the exact page she was reading in the bath."},
haddad:{pre:"The vents begin to rattle, one after another, as if something huge is breathing behind the walls. A few scouts slip through the gaps and stream across the glass in thin black lines. Dr. Haddad watches them with her pen still raised, writing nothing. 'Subject's heart rate: elevated,' she says aloud, then laughs once, softly. 'The subject is me. That's new.'",
 after:"The next morning, Freud the terrier is found sitting outside the Observation Suite, waiting. He won't leave. Someone from the faculty takes him home. Late that night, at 3 a.m., the old movie theater downtown runs her favorite black-and-white film to an empty room, because she always reserved the seat."},
solberg:{pre:"The conveyor's motor coughs. A bolt on the drive housing works itself loose, spins on the floor, and rolls to a stop at your feet. The belt shudders forward, catches, shudders again. Heat pours out of the furnace mouth so thick the air ripples like water. Prof. Solberg watches the bolt with professional interest. 'Torque failure,' she says. 'Poor maintenance. My fault, actually.'",
 after:"The next morning, the lake is perfectly still at sunrise. Nobody is swimming in it. In the foundry, her RC car sits on her desk, half-rebuilt, a tiny screwdriver still in the chassis. Someone finds a recipe card for cinnamon buns taped under the drawer, addressed to you."}

kaur:{intro:"Lab C-4 is ten degrees hotter than the hallway. In the center sits the vat: a squat steel drum two meters across, its rim crusted white with mineral scale. The acid inside is a cloudy yellow, simmering, and every few seconds a bubble the size of a fist rises, swells and pops with a wet cough, releasing a curl of choking vapor. Above it, Dr. Kaur hangs in a harness from a chain winch bolted to the ceiling beam, its motor ticking. A readout on the wall shows the gap between her boots and the surface: 5.0 m.",
 ambient:["The vat burps a fat yellow bubble. Vapor drifts up and fogs the safety glass on the wall.","The winch motor hums, idles, hums again. The readout flickers but holds.","A drop of condensation falls from the chain and hits the acid with a sharp hiss.","The extraction fans roar, losing the fight against the fumes. Your eyes sting.","The surface ripples as a deeper bubble rolls up from the bottom of the vat.","Dr. Kaur shifts her grip on the harness strap. The chain creaks."],
 strikes:["The winch drops her a full meter with a clank. Readout: 4.0 m. Vapor curls around her ankles. 'One. Fine. I'm fine. Focus.'","Another meter. 3.0 m. Heat off the vat makes the air shimmer, and she pulls her knees up without meaning to. 'Two. I'd appreciate it if you stopped doing that.'","2.0 m. The fumes are thick enough now that she's coughing, eyes streaming. Her braid hangs down toward the surface. 'Three.' Barely a whisper.","1.0 m. The bubbles are breaking right under her, spattering. A drop lands on her boot and smokes. She doesn't speak. She just looks at you."]},
sato:{intro:"Hall 2B's front wall is a glass tank four meters wide, lit an eerie green from below. Hundreds of red-bellied piranhas circle in a slow, endless loop, scales flashing. Ms. Sato stands on a small steel platform on hydraulic pistons above the open top of the tank, her sneakers at the edge. A pressure gauge on the pistons reads 100%.",
 ambient:["The school of piranhas turns all at once, a silver wall flashing past the glass.","Bubbles stream up from the filter. A piranha nips at them out of habit.","The hydraulic pistons hiss softly, holding. The gauge is steady.","One fish bumps the glass right in front of you, teeth showing.","The green light ripples across the ceiling as if the whole room is underwater.","Ms. Sato bounces nervously on her toes, then stops herself. The platform wobbles."],
 strikes:["The pistons hiss and the platform drops. Gauge: 80%. The tank churns below her. 'Ha! Okay! Totally fine!'","Gauge: 60%. Water sloshes over the platform and soaks her sneakers. The fish go frantic at the splash. 'Not fine. Slightly less fine.'","Gauge: 40%. The water is at her ankles. A piranha flashes past her foot. She grips the rail so hard her knuckles go white, and she's stopped joking.","Gauge: 20%. The water is at her knees. Something brushes her leg. She lets out a tiny, high sound and squeezes her eyes shut."]},
brandt:{intro:"The enclosure is a sunken pit of hot sand and sun-bleached rock, five meters below the greenhouse floor. Three Komodo dragons lie in the heat, each nearly three meters long, gray-brown and armored, with ropes of saliva at the corners of their mouths. Dr. Brandt sits in a rope sling hung from an iron pulley, dangling over the center of the pit. The coil on the winch drum shows how much slack is left.",
 ambient:["The biggest dragon flicks its long yellow tongue, tasting the air.","Sand hisses as one of the dragons drags itself a little closer, belly scraping.","The pulley creaks as the sling turns slowly in the warm air.","Heat lamps buzz overhead. The rocks shimmer.","A dragon yawns, showing a mouth full of serrated teeth.","Dr. Brandt hums under her breath. The smallest dragon, Fritz, tilts his head at the sound."],
 strikes:["The winch pays out with a jolt. She drops a meter, swinging. All three dragons lift their heads. 'Ja, ja. I see you.'","Another meter. Her boots are level with the tops of the rocks now. The big one rises onto its forelegs. 'Easy. Easy, big one.'","She drops again. The largest dragon lunges and snaps a foot short; its jaws close with a sound like a car door. She yanks her legs up, breathing fast.","One meter of slack left. The dragons are directly under her, still as statues, waiting. She's stopped humming."]},
okafor:{intro:"The arena is a sandstone oval lit by iron braziers, its tiered seats rising into darkness. In the center, Prof. Okafor stands chained to a weathered post, wrists above her head. At the far end is a massive iron portcullis on chains, and behind it, in the gloom, something large paces back and forth. A great wooden gear wheel beside the gate is marked with five notches.",
 ambient:["A low growl rolls out of the dark behind the gate. The braziers flicker.","Sand drifts across the arena floor in the night wind.","The chains on the gear wheel creak under their own weight.","A pair of amber eyes catches the firelight behind the bars, then vanishes.","Somewhere in the pens a lion roars, and the sound echoes around the empty stands.","Prof. Okafor tests her chains, then straightens."],
 strikes:["The gear wheel clanks one notch. The portcullis lifts a foot, and a paw the size of a dinner plate rakes the sand underneath. 'Morituri te salutant. Let's not make it literal.'","Two notches. The gate is at waist height. A lioness slides her head underneath, ears flat, then pulls back. Okafor has stopped speaking.","Three notches. The gap is wide enough to crawl through. Two lions pace right at the opening, growling. Okafor is breathing hard, chin still high.","Four notches. One lion is halfway under. It stops and stares straight at her. She whispers something in Latin, very fast."]},
delgado:{intro:"The fieldhouse is roasting. A channel has been cut into the floor beside the track and filled with lava, glowing orange-red and crusting black at the edges. It moves slowly, like syrup, and every few seconds a blister of molten rock swells and bursts with a heavy plop, flinging bright droplets that hiss on the concrete. Above it, Coach Delgado is locked in a steel cage hanging from a crane arm. The bars are already too hot to hold for long.",
 ambient:["The lava belches a fat bubble that bursts and spits glowing drops onto the edge of the track.","The cage sways on its chain, and the crane arm groans.","A crust of black rock cracks open on the lava, showing white-hot liquid underneath.","Heat rises off the trench so thick the far wall wobbles.","Delgado yells your lap count, hoarse, sweat pouring down her face."]},
moreau:{intro:"Beneath the Old Library's stained-glass dome is a sunken pool of dark green water ringed with stone. Long shapes lie motionless just under the surface: saltwater crocodiles, five meters long, only their eyes and nostrils showing. A wooden plank juts over the pool on an iron hinge, and Ms. Moreau is bound to its far end. A ratchet at the hinge controls the tilt. It's set at 10°.",
 ambient:["A crocodile surfaces without a sound, eyes gleaming, then sinks without a ripple.","Colored light from the stained glass drifts across the water.","Somewhere under the surface, something huge rolls over. The water bulges.","The ratchet clicks once, then settles. The plank holds.","A crocodile opens its jaws to bask, rows of teeth catching the light, then shuts them with a heavy clack.","Ms. Moreau murmurs a line of poetry to steady herself."],
 strikes:["The ratchet clicks. 20°. She slides a few inches toward the water. 'Mon dieu. Do not go gentle, chéri.'","30°. Her slippers slip off and drop into the pool. The water explodes around them and they're gone. She stares at the spot.","40°. She's sliding now, the bindings creaking. Three sets of eyes are on her, drifting closer.","50°. Her hair trails in the water. A crocodile glides directly beneath her, and she holds perfectly still, barely breathing."]},
haddad:{intro:"The Observation Suite is a sealed glass cube, three meters on a side, sitting in a dim room full of monitors. Dr. Haddad stands inside it, clipboard in hand. In each wall is a steel vent, and behind every vent, pressed against the mesh, is a seething black mass: a colony of army ants, millions strong, rustling like dry leaves. A panel outside shows five vent locks, all green.",
 ambient:["The ants surge against the mesh, a ripple running through the whole black mass.","The rustling grows louder, then softer, like breathing.","A few ants squeeze through a gap and march across the glass in a thin line.","A monitor shows Dr. Haddad's heart rate: steady, for now.","She writes something on her clipboard, then crosses it out.","A vent rattles in its frame. One of the green lights flickers."],
 strikes:["A lock turns red. The first vent grates open and a river of ants pours across the floor. Heart rate: 140. 'Interesting.'","Two red. The floor is black and moving. She climbs onto her chair, and the ants start up its legs. Heart rate: 160.","Three red. The ants are climbing the glass walls in sheets, blotting out the light. Her voice has gone thin. 'Let's not find out what 200 looks like.'","Four red. Only the top of the cube is still clear. She's pressed into the last clean corner, clipboard shaking. Heart rate: 190."]},
solberg:{intro:"The foundry floor is lit by one source: the mouth of a blast furnace, a rectangle of white-orange fire that roars like a jet engine. A steel conveyor belt runs straight into it, and Prof. Solberg is strapped to the belt by her wrists and ankles. A gauge on the housing counts the distance to the furnace mouth: 10 meters. Every so often the furnace exhales a gout of flame and sparks that rain down and wink out on the floor.",
 ambient:["The furnace exhales. A shower of sparks drifts across the floor like fireflies.","Molten slag drips from a pipe into a crucible with a heavy, glowing splash.","The conveyor motor idles with a low electric hum.","The air near the furnace ripples so hard the walls behind it seem to melt.","A pressure valve shrieks and vents steam, then goes quiet.","Prof. Solberg turns her face from the heat, eyes narrowed, and keeps watching you."],
 strikes:["The belt lurches. 8 m. Her hair lifts in the heat. 'Radiant heat, roughly eleven hundred degrees. Next answer. Correct, preferably.'","6 m. Sweat runs down her face and her glasses fog. The straps are hot to the touch. She doesn't comment this time.","4 m. The roar is so loud she has to shout. Sparks land on the belt beside her and smolder.","2 m. The leather straps are smoking. She's stopped trying to talk and is just breathing, fast and shallow, staring at the ceiling."]}

kaur:"*Her composure finally breaks. Her voice shakes.* 'Okay. Okay, I'm— I'm scared. Is that stupid? Tell Priya, my sister, tell her I'm sorry I missed her birthday. I was going to visit in December.' *A breath.* 'Don't look. Please don't look at me.'",
sato:"*She's crying now, glasses fogged, trying to laugh through it.* 'This is so dumb. I had so much I wanted to— I never even went to Iceland.' *She sniffs hard.* 'Can you feed Integral? Only the salmon kind. He'll pretend he's starving. He's not. He's such a liar.'",
brandt:"*Her voice drops to almost nothing.* 'Arif. I'm sorry, Arif.' *Then she finds you, and tries to smile.* 'Don't watch, ja? I don't want this to be how you remember me. Remember the bread. Even if it was bad.'",
okafor:"*The grandeur falls away. She's just a woman chained to a post, shaking.* 'I don't want to be a lesson. I wanted to get old. I wanted to see Adaeze grow up.' *Her voice breaks.* 'Tell her Auntie loved her. Tell her the stories. Do the voices.'",
delgado:"*The bravado cracks. She grips the hot bars anyway, and her voice is small.* 'I lied to her every morning, Rookie. My abuela. I told her I was fine.' *She wipes her face with her wrist, then forces a grin.* 'You ran good. You hear me? You ran so good.'",

haddad:"*She presses her palm to the glass, right where your hand is. The clinical calm is gone.* 'I'm afraid. I'm so afraid. It's August again.' *A shaky breath.* 'Take Freud home. He sleeps on the left side of the bed. Please.'",
solberg:"*She tries to say something precise and can't. Her voice cracks.* 'I wanted to see one launch. Just one.' *She laughs, wet and short.* 'The recipe's under my drawer. Half a teaspoon more cardamom than you'd think. Don't tell anyone.'"

sato:[{trap:"Strapped to a table beneath a giant pendulum blade that drops lower with every swing.",scene:"#2a2a4a",
 intro:"Hall 2B's ceiling has been opened to the rafters. From them hangs a pendulum: a steel arm eight meters long ending in a crescent blade as wide as a door, swinging in a slow, enormous arc across the room. Each pass makes a deep whoosh you feel in your chest. Ms. Sato is strapped flat to a table directly beneath it. A ratchet on the pivot lowers the arm a notch whenever it's triggered, and a counter shows the clearance above her: 2.0 m. She's already calculated the period and tells you anyway. 'Five-point-seven seconds! Simple harmonic motion!'",
 ambient:["The blade sweeps past overhead. Whoosh. The air it pushes ruffles her bangs.","The pivot creaks at the top of each swing, a long metal groan.","Whoosh. She counts the seconds under her breath, out of habit.","A strip of paper left on the table flutters up as the blade passes and is sliced neatly in two."],
 strikes:["The ratchet clacks. 1.6 m. The next whoosh is noticeably louder. 'Okay! The period doesn't change with amplitude! Fun fact! Please stop!'","1.2 m. She can feel the wind of each pass on her face now. She's stopped counting out loud.","0.8 m. The blade passes so close she squeezes her eyes shut on every swing. Whoosh. Whoosh.","0.4 m. The edge hisses through the air a hand's width above her sweater. She's whimpering softly between swings and doesn't seem to know it."],

 {trap:"Locked in a diving cage lowered by crane into a tank of great white sharks.",scene:"#103a4a",

brandt:[{trap:"Lowered into a pit of starving spotted hyenas.",scene:"#4a3418",
 intro:"Behind the greenhouse is an older enclosure: a dry pit of packed dirt and old bones, ringed by chain-link. A pack of six spotted hyenas lives in it, and they haven't been fed in three days. They pace in a tight, restless circle, giggling, that high, manic whoop that makes the hair on your arms stand up. Dr. Brandt hangs in a harness on a cable winch over the center. The cable counter shows: 4 m.",
 ambient:["A hyena whoops, and the rest of the pack answers in a cascade of giggles.","Two hyenas squabble over an old bone, snapping, then go back to circling.","The winch motor clicks and ticks, holding.","The biggest female sits and stares straight up at Dr. Brandt, very still."],

 {trap:"Locked in a mesh enclosure with a nest of giant hornets as a mechanical arm strikes the hive.",scene:"#4a3a14",
 intro:"In the far corner of the greenhouse, behind a sealed mesh enclosure, hangs a hornet nest the size of a car tire: gray paper, layered like a cabbage, humming. Asian giant hornets, each the length of your thumb, with orange heads and black-banded bodies, crawl over its surface. Dr. Brandt stands inside the enclosure, an arm's length from the nest, with no protective gear. A mechanical arm with a steel rod is poised above it. Its control box shows the strikes: 0 of 5.",

okafor:[{trap:"Chained to the arena's central barrier as scythe-wheeled war chariots race the track around her.",scene:"#5a3a1a",
 intro:"Tonight the arena is set up as a miniature Circus Maximus: a sand oval with a long stone barrier, the spina, down the middle. Prof. Okafor is chained to its center. Three war chariots wait at the starting gates, each pulled by four horses in bronze-studded harness, each with long curved scythes bolted to its wheel hubs, glinting in the torchlight. The horses stamp and blow. A stone tablet counts the laps: 0 of 5. With each lap the charioteers steer closer.",
 ambient:["The horses snort and paw the sand. A charioteer leans down and checks his scythe bolts.","Torch smoke drifts across the track.","The wind moaning through the empty arches sounds almost like a crowd cheering.","Prof. Okafor recites the racing colors under her breath: 'Reds, Whites, Blues, Greens.'"],

 pre:"On the final turn, one chariot clips the barrier and starts to fishtail. The charioteer fights it. Prof. Okafor watches it come toward her sideways, out of control, and stops reciting and simply watches, the way she'd watch a moment in history unfold.",
 fail:"The chariot loses the fight and skids across the track straight at the spina.",
 fx:"It hits the barrier where she stands. The horses scream, the chariot flips, the scythes spin through the air, and the arena fills with a cloud of sand and splinters and the sound of wood and metal and stone breaking. The impact throws you to your knees. You can't see anything through the dust.",
 silence:"When the dust settles, the chariot is a wreck of splintered wood and twisted bronze against the barrier, one wheel still spinning slowly with its scythe still bolted on. The chain hangs snapped from the stone. The sand around the wreck is splashed dark. The horses stand trembling in a corner of the arena.",

 {trap:"Lowered on a platform into the pit beneath the arena with two hungry brown bears.",scene:"#4a2a1a",

moreau:[{trap:"Bound to a standing stone on the moor at night as a wolf pack closes in.",scene:"#1a2a3a",

function dialogue(id,lines,tag,onDone){

let samplePromise=null;
function getSample(){
  return samplePromise||(samplePromise=(async()=>{
    const key=localStorage.getItem("peril-academy-apikey");
    if(!key)return null;
    const call=async(messages,opts={})=>{
      const r=await fetch("https://api.x.ai/v1/chat/completions",{
        method:"POST",
        headers:{"Authorization":`Bearer ${key}`,"content-type":"application/json"},
        body:JSON.stringify({model:"grok-3",messages,max_tokens:4000,temperature:0.7})
      });
      if(!r.ok)throw{code:"api_error",text:await r.text()};
      const j=await r.json();
      const text=j.choices?.[0]?.message?.content||"";
      if(opts.onText)opts.onText({text});
      return {text};
    };
    const api=async(input,opts={})=>{
      const messages=Array.isArray(input)?input:[{role:"user",content:String(input)}];
      return call(messages,opts);
    };
    api.json=async(prompt,opts={})=>{
      const messages=[{role:"user",content:prompt}];
      if(opts.images&&opts.images.length){
        const img=opts.images[0];
        const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(",")[1]);fr.readAsDataURL(img)});
        messages[0].content=[{type:"image_url",image_url:{url:`data:${img.type||"image/jpeg"};base64,${b64}`}},{type:"text",text:prompt}];
      }
      const {text}=await call(messages,opts);
      try{return JSON.parse(text.replace(/^```json\s*|\s*```$/g,""))}catch(e){return {raw:text}}
    };
    api.limits=async()=>({images:true});
    return api;
  })().catch(()=>null));
}

function quiz(id,qs,tag,onEnd,M){
  const slot=stageShell(id,tag);const stage=view.querySelector(".stage");
  qs=qs.slice().sort(()=>Math.random()-.5);
  M=M||MACHINE[id];const amb=M?.ambient||["The mechanism hums, waiting.","She watches you, holding her breath."];
  let qi=0,wrong=0;const LIMIT=40;let lastStrike="";
  const draw=()=>{
    const q=qs[qi];let left=LIMIT;
    slot.innerHTML=`<div class="peril"><span class="label">Peril · ${wrong}/${STRIKES} strikes · ${qs.length-qi} questions left</span><div class="meter"><i style="width:${wrong/STRIKES*100}%"></i></div></div>
    <p class="note">${esc(lastStrike||amb[qi%amb.length])}</p>
    <div class="box"><span class="label">Question ${qi+1} of ${qs.length}</span><p class="q">${esc(q.q)}</p>
    <div class="timer"><i id="tm" style="width:100%"></i></div>
    <div class="opts">${q.o.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join("")}</div>
    <p class="explain" id="ex" aria-live="polite"></p><p class="strike" id="strk" hidden></p></div>
    <div class="controls"><button class="primary" id="nx" hidden>Next</button></div>`;
    lastStrike="";
    const btns=[...slot.querySelectorAll(".opts button")];
    clearInterval(timerHandle);
    timerHandle=setInterval(()=>{left-=.25;const el=document.getElementById("tm");if(el)el.style.width=(left/LIMIT*100)+"%";if(left<=0)answer(-1)},250);
    const answer=k=>{clearInterval(timerHandle);btns.forEach(b=>b.disabled=true);btns[q.a].classList.add("right");
      const ok=k===q.a;if(!ok){wrong++;if(k>=0)btns[k].classList.add("wrong");stage.classList.remove("flash-bad");void stage.offsetWidth;stage.classList.add("flash-bad")}
      document.getElementById("ex").textContent=(k<0?"Time's up. ":ok?"Correct. ":"Wrong. ")+(q.ex||"");
      if(!ok&&wrong<STRIKES){const sk=document.getElementById("strk");sk.textContent=M?.strikes?.[wrong-1]||"The mechanism lurches closer. She grips tight and looks at you.";sk.hidden=false;lastStrike=sk.textContent}
      view.querySelector(".meter i").style.width=(wrong/STRIKES*100)+"%";view.querySelector(".peril .label").textContent=`Peril · ${wrong}/${STRIKES} strikes · ${qs.length-qi-1} questions left`;
      const nx=document.getElementById("nx");nx.hidden=false;nx.textContent=wrong>=STRIKES?"…":qi===qs.length-1?"Finish":"Next";nx.focus();
      nx.onclick=()=>{if(wrong>=STRIKES)return onEnd(false);qi++;if(qi>=qs.length)onEnd(true);else draw()}};
    btns.forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  };draw();
}
function pacer(id,onEnd,M){M=M||MACHINE.delgado;
  const slot=stageShell(id,"Fieldhouse · PACER test");
  let laps=0,misses=0,speed=0.42,x=0,running=false,last=0;const GOAL=150;
  slot.innerHTML=`<div class="peril"><span class="label">Laps toward release</span><div class="meter"><i id="pm" style="width:0%"></i></div></div>
   <div class="box"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><span class="label">Laps</span><div class="bigcount" id="lc">0</div></div><div class="note" id="pmsg">Press Turn (or Space) while the runner is in the green zone. Each clean turn is 5 laps. Two misses in a row ends the test.</div></div>
   <div class="track" id="trk"><div class="zone"></div><div class="runner" id="rn"></div></div></div>
   <div class="controls"><button class="primary" id="go">Start</button><button id="turn" disabled>Turn!</button></div>`;
  const trk=document.getElementById("trk"),rn=document.getElementById("rn"),msg=document.getElementById("pmsg");
  const W=()=>trk.clientWidth-34;
  const tick=t=>{if(!running)return;const dt=last?(t-last)/1000:0;last=t;x+=dt*speed;rn.style.left=(Math.min(x,1)*W())+"px";if(x>1.06)fail("Missed the beep!");rafId=requestAnimationFrame(tick)};
  const fail=m=>{misses++;msg.textContent=m+(misses>=2?" Two in a row.":" One warning left. "+(M.strikes?.[0]||DOOM.delgado.strike));x=0;if(misses>=2){running=false;cancelAnimationFrame(rafId);setTimeout(()=>onEnd(false),900)}};
  const turn=()=>{if(!running)return;if(x>=0.84&&x<=1.06){laps+=5;misses=0;speed*=1.045;x=0;msg.textContent=laps%25===0?"Level up. The beeps are faster! "+M.ambient[(laps/25-1)%M.ambient.length]:"Clean turn.";
      document.getElementById("lc").textContent=laps;document.getElementById("pm").style.width=Math.min(laps/GOAL*100,100)+"%";
      if(laps>=GOAL){running=false;cancelAnimationFrame(rafId);msg.textContent="150!";setTimeout(()=>onEnd(true),700)}}else fail("Too early!")};
  document.getElementById("go").onclick=e=>{e.target.disabled=true;const tb=document.getElementById("turn");tb.disabled=false;tb.focus();running=true;last=0;rafId=requestAnimationFrame(tick)};
  document.getElementById("turn").onclick=turn;
  const key=e=>{if(!document.body.contains(trk)){removeEventListener("keydown",key);return}if(e.code==="Space"&&running){e.preventDefault();turn()}};
  addEventListener("keydown",key);
}

async function describe(file,context,wantProfile){

  const caps=await sample.limits().catch(()=>null);if(!caps?.images)return{err:ERR.images_unavailable};
  const shape=wantProfile?`{"name":string,"age":number (18-39),"subject":string (a real college subject),"look":string,"body":string,"outfit":string,"personality":string,"backstory":string,"syllabus":[10 short lesson topics for the term in a sensible order]}`:`{"look":string,"body":string,"outfit":string}`;
  const prompt=`${context}\nLook at the attached image of a person. Write a character description for a college visual novel.\n- "look": 1-2 sentences on her physical features only: apparent ethnicity or skin tone, hair, eyes, build.\n- "body": 1-2 sentences describing her figure as it appears in her outfit: waist, hips, any bare midriff and navel, the neckline and any cleavage showing. Sensual but non-explicit.\n- "outfit": 1-2 sentences listing each item accurately, including exactly how much skin it shows (for example "a cropped burgundy sweater ending well above the navel, leaving her whole midriff bare"). Then exactly what she is wearing in the image, piece by piece, with colors, cut and accessories (for example "a white cropped tank top, low-rise denim shorts and a thin gold anklet"). Plain, non-explicit wording.\n${wantProfile?'- Invent a fitting name, an adult age between 18 and 39, a college subject she teaches, a 2-sentence personality, a 2-sentence backstory, and a 10-topic syllabus.\n':""}If the person appears to be under 18, reply {"error":"minor"}. If there is no person, reply {"error":"no_person"}.\nReply with only JSON shaped like ${shape}.`;
  try{const r=await sample.json(prompt,{images:[file],modelTier:"default"});
    if(r?.error==="minor")return{err:"This image looks like it shows someone under 18, so it can't be used for a teacher."};

      if(sample){try{const r=await sample.json(`Invent ${need} unique, dramatic test-day death traps for ${T(id).name}, who teaches ${T(id).subject} at Peril Academy, a dramatic college visual novel. Each is one sentence describing how she is restrained or placed and what deadly thing awaits (wild animals, heat, cold, water, chemicals, machines, falls, crushing, nature). Make them varied and inventive, some tied to her subject or life. Every trap must be different from each other and from all of these existing traps: ${used.join(" | ")}
Reply with only JSON: {"traps":[${need} strings]}`,{modelTier:"quick",cache:false});
        const set=new Set(used.map(x=>x.toLowerCase()));traps=(r.traps||[]).map(x=>String(x).slice(0,220)).filter(x=>x&&!set.has(x.toLowerCase()))}catch(e){}}
      if(traps.length<need)traps=traps.concat(fallbackPlan(need-traps.length,used.concat(traps)));
      S.trapPlan2[id]=traps.slice(0,need);save();
      for(let n=3;n<TESTS[id].length;n++){const dm=DOOMS[id][n];if(dm&&dm.theme&&!dm.intro)dm.trap=S.trapPlan2[id][n-3]}
      if(document.getElementById("cal"))drawCalendar();
    }
  })().finally(()=>{planning=null});
  return planning;
}
function drawCalendar(){
  const box=document.getElementById("cal");if(!box)return;const d=S.day;
  const short=s=>s.length>46?s.slice(0,44)+"…":s;
  box.innerHTML=`<table><thead><tr><th>Day</th>${ORDER.map(id=>`<th>${esc(T(id).subject)}</th>`).join("")}</tr></thead><tbody>${DAYNAMES.map((n,i)=>`<tr id="cal-${i}" class="${i===d?"today":i<d?"past":""}"><td>${n.replace("Week ","W").replace(" · "," ")}</td>${ORDER.map(id=>{if(!isTest(id,i))return"<td></td>";const k=testIndex(id,i),tr=getDoom(id,k).trap,r=resultOf(id,i);
    return `<td class="tcell ${r||""}" title="${esc(tr)}"><b>${r==="saved"?"✓ Saved":r==="lost"?"✗ Lost":`Test ${k+1}`}</b><span>${esc(short(tr))}</span></td>`}).join("")}</tr>`).join("")}</tbody></table>`;
  const row=document.getElementById("cal-"+d);if(row)box.scrollTop=Math.max(0,row.offsetTop-box.querySelector("thead").offsetHeight-8);
}

applyFaculty();
go("schedule");
</script>
