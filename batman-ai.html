<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#18181d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batman.ai">
<title>Batman.ai</title>
<style>
:root{
  --bg:#0f0f12; --panel:#18181d; --panel2:#202027; --line:#2c2c35;
  --text:#ececf1; --muted:#9a9aa8; --accent:#8b5cf6; --accent2:#a78bfa;
  --danger:#ef4444; --bubble-ai:#23232b; --bubble-me:#3b2a6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:9px 14px}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--accent);color:#fff;font-weight:600}
button.danger{background:transparent;color:var(--danger);border:1px solid #4a2020}
button.ghost{background:transparent;border:1px solid var(--line)}
button.icon{padding:7px 10px;background:transparent}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:400px}
.brand{font-size:26px;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--accent2)}
.tabs{display:flex;gap:6px;margin:18px 0 6px;background:var(--panel2);padding:4px;border-radius:12px}
.tabs button{flex:1;background:transparent}
.tabs button.on{background:var(--accent);color:#fff}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

/* App shell */
#app{height:100vh;height:var(--app-h,100dvh);display:flex;flex-direction:column;overflow:hidden}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
header{padding-top:calc(10px + env(safe-area-inset-top))!important}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-size:19px;flex:1}
.view{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}

/* Home */
.home{max-width:1100px;margin:0 auto;padding:18px}
.search{max-width:420px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .12s}
.ccard:hover{transform:translateY(-2px);border-color:#3d3d4a}
.ccard .img{aspect-ratio:3/4;background:#26262e center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#55556a}
.ccard .meta{padding:10px 12px}
.ccard .name{font-weight:700}
.ccard .tag{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:60px 20px}

/* Editor */
.editor{max-width:760px;margin:0 auto;padding:18px 18px 80px}
.avatar-pick{display:flex;gap:14px;align-items:center}
.avatar-pick .pv{width:96px;height:128px;border-radius:12px;background:#26262e center/cover no-repeat;flex-shrink:0;border:1px solid var(--line)}
.emos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.emo{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px}
.emo .pv{aspect-ratio:3/4;border-radius:8px;background:#26262e center/cover no-repeat;margin-bottom:6px}
.emo input{padding:6px 8px;font-size:13px}
.emo button{width:100%;margin-top:6px;padding:5px;font-size:12px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.section h3{margin:0 0 4px;font-size:15px}

/* Chat */
/* Chat layout: grid so the portrait sits beside the chat on desktop and above it on phones */
.chat{display:grid;height:100%;min-height:0;
  grid-template-columns:minmax(0,1fr) min(40vw,460px);
  grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top port" "msgs port" "bar port" "comp port"}
.chat.noport{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "msgs" "bar" "comp"}
.chat.noport .portrait{display:none}
.chat-top{grid-area:top}.msgs{grid-area:msgs}.scenebar{grid-area:bar}.composer{grid-area:comp}.portrait{grid-area:port}
.chat-top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chat-top .av{width:38px;height:38px;border-radius:50%;background:#26262e center/cover;flex-shrink:0}
.chat-top .t{flex:1;min-width:0}
.chat-top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:16px 12px}
.msg{display:flex;gap:10px;margin:0 auto 14px;max-width:760px}
.msg .av{width:34px;height:34px;border-radius:50%;background:#26262e center/cover;flex-shrink:0}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:13px;font-weight:700;margin-bottom:2px}
.msg .who .mood{font-weight:400;color:var(--accent2);font-size:11px;margin-left:6px}
.msg .txt{background:var(--bubble-ai);padding:10px 13px;border-radius:4px 14px 14px 14px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{flex-direction:row-reverse}
.msg.me .who{text-align:right}
.msg.me .txt{background:var(--bubble-me);border-radius:14px 4px 14px 14px}
.txt em{color:#c4b5fd;font-style:italic}
.msg .tools{display:flex;gap:2px;opacity:.55;font-size:12px;margin-top:3px}
.msg.me .tools{justify-content:flex-end}
.msg .tools button{padding:3px 7px;font-size:12px;background:transparent}
.msg:hover .tools{opacity:1}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.composer textarea{min-height:44px;max-height:160px;resize:none}
.composer button{align-self:flex-end}
.typing::after{content:'▍';animation:blink 1s infinite;color:var(--accent2)}
@keyframes blink{50%{opacity:0}}

/* Big portrait panel */
.portrait{border-left:1px solid var(--line);background:#0b0b0e;position:relative;display:flex;flex-direction:column;min-height:0}
.portrait .pimg{flex:1;background:center/contain no-repeat;transition:background-image .25s;cursor:zoom-in}
.portrait .plabel{position:absolute;bottom:10px;left:10px;background:#000b;padding:4px 10px;border-radius:999px;font-size:12px}
.portrait .pclose{position:absolute;top:8px;right:8px;background:#000a;border-radius:999px;width:36px;height:36px;padding:0}
.ai-box{border-color:#3d2f6b;background:linear-gradient(180deg,#1f1a2e,var(--panel))}
.ai-box textarea{margin-top:10px}
button:disabled{opacity:.6;cursor:wait}
.editbox textarea{min-height:100px}
.editbox .row{margin-top:6px}
.editbox button{padding:7px 14px}



/* Modal */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:520px;max-height:90vh;overflow:auto}
.lightbox{position:fixed;inset:0;background:#000e;z-index:60;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:94vh;border-radius:8px}
.sec{margin:24px 0 0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ccard .img.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:stretch;justify-items:stretch;position:relative;font-size:26px;overflow:hidden}
.collage>div{min-height:0;background:#2a2a33 center/cover no-repeat;display:flex;align-items:center;justify-content:center;border:1px solid var(--panel)}
.collage.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.collage.n1>div{grid-row:auto!important}
.collage.n2>div{grid-row:span 2}
.collage.n3>div:first-child{grid-row:span 2}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.05em}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px}
.pickc{margin:0;position:relative;cursor:pointer;color:var(--text);text-align:center;font-size:12px}
.pickc input{position:absolute;opacity:0;pointer-events:none}
.pickc .pv{aspect-ratio:3/4;border-radius:10px;background:#26262e center/cover no-repeat;border:2px solid var(--line);margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#55556a;transition:all .12s}
.pickc input:checked + .pv{border-color:var(--accent);box-shadow:0 0 0 3px #8b5cf655}
.pickc input:not(:checked) + .pv{opacity:.55}
.stack{display:flex;flex-shrink:0}
.stack .av{width:34px;height:34px;border-radius:50%;background:#26262e center/cover;border:2px solid var(--panel);margin-left:-12px;cursor:pointer}
.stack .av:first-child{margin-left:0}
.chat-top .av{cursor:pointer}
.scenebar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel)}
.scenebar select{width:auto;padding:6px 10px;font-size:13px}
.scenebar button{padding:6px 12px;font-size:13px}
.msg.narr .av{display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.narr .txt{background:transparent;border:1px dashed var(--line);color:#cfcfe0;font-style:italic}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:70}
/* ---------- Phones ---------- */
@media (max-width:760px){
  input,textarea,select{font-size:16px} /* stops iOS zooming in on focus */
  #app:has(.chat) > header{display:none}  /* chat gets the full screen */
  .chat{grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto auto;
    grid-template-areas:"top" "port" "msgs" "bar" "comp"}
  .chat.noport{grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "msgs" "bar" "comp"}
  .portrait{height:36vh;height:36dvh;border-left:0;border-bottom:1px solid var(--line)}
  body.kb .portrait{display:none} /* hide while the keyboard is up */
  body.kb .chat{grid-template-rows:auto 0 minmax(0,1fr) auto auto}
  .chat-top{padding:6px 4px;padding-top:calc(6px + env(safe-area-inset-top));gap:6px}
  .chat-top .icon{padding:8px 7px;font-size:18px;min-width:38px}
  .chat-top .t .small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msgs{padding:12px 10px}
  .msg{gap:8px;margin-bottom:12px}
  .msg .av{width:30px;height:30px}
  .composer{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .composer button{min-height:44px}
  .scenebar{padding:6px 10px}
  .home{padding:12px}
  .home .search{flex:1 1 100%!important;max-width:none}
  .home .row button{flex:1;padding:10px 6px;white-space:nowrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  .editor{padding:12px 12px 100px}
  .section{padding:14px;border-radius:14px}
  .modal{padding:0;align-items:flex-end}
  .modal .card{max-width:none;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom));max-width:90vw;text-align:center}
}
@media (min-width:1100px){ .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))} }

/* Touch screens: message buttons appear when you tap a message */
@media (hover:none){
  .msg .tools{display:none;opacity:1}
  .msg.open .tools,.msg .tools.always{display:flex}
  .msg .tools button{padding:8px 12px;font-size:13px}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="hidden">
  <div class="card">
    <div class="brand">Batman<span>.ai</span></div>
    <div class="muted small">Chat with your own characters, powered by Grok.</div>
    <div class="tabs">
      <button id="tabLogin" class="on">Log in</button>
      <button id="tabReg">Sign up</button>
    </div>
    <label>Username</label>
    <input id="aUser" autocomplete="username">
    <label>Password</label>
    <input id="aPass" type="password" autocomplete="current-password">
    <div id="regExtra" class="hidden">
      <label>Display name (how characters address you)</label>
      <input id="aDisplay">
      <label class="row" style="margin-top:16px;color:var(--text)"><input id="aAge" type="checkbox" style="width:auto"> I confirm I am 18 or older</label>
    </div>
    <div class="err" id="aErr"></div>
    <button class="primary" id="aGo" style="width:100%;margin-top:6px">Log in</button>
    <button class="ghost" id="aRestore" style="width:100%;margin-top:8px">Restore from backup file</button>
    <p class="muted small" style="margin-bottom:0">Accounts are stored on this device in your browser. Use Settings → Backup to move them to another browser or device.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand" id="homeBtn" style="cursor:pointer">Batman<span>.ai</span></div>
    <button class="icon" id="settingsBtn" title="Settings">⚙️</button>
    <button class="icon" id="logoutBtn" title="Log out">⏻</button>
  </header>
  <div class="view" id="view"></div>
</div>

<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<input type="file" id="restoreFile" accept=".json,application/json" class="hidden">

<script>
/* ============ Storage (IndexedDB key/value) ============ */
const DB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('persona-chat', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), s = t.objectStore('kv');
      const req = fn(s);
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', s => s.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)),
    del: k => tx('readwrite', s => s.delete(k)),
  };
})();

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
function undoToast(msg, onUndo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${esc(msg)} <button style="margin-left:10px;padding:4px 12px;color:var(--accent2);font-weight:700">Undo</button>`;
  t.querySelector('button').onclick = () => { t.remove(); onUndo(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

/* Keep the app sized to the visible screen (handles phone keyboards and browser bars) */
let baseH = 0;
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  baseH = Math.max(baseH, h);
  document.documentElement.style.setProperty('--app-h', h + 'px');
  const kb = h < baseH * 0.75;
  document.body.classList.toggle('kb', kb);
  if (vv && vv.offsetTop) window.scrollTo(0, 0);
  const box = document.getElementById('msgs');
  if (box && kb) box.scrollTop = box.scrollHeight;
}
window.visualViewport?.addEventListener('resize', fitViewport);
window.visualViewport?.addEventListener('scroll', fitViewport);
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', () => { baseH = 0; setTimeout(fitViewport, 300); });
fitViewport();

const ls = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };

async function hash(str) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch { // fallback when crypto.subtle is unavailable
    let h = 5381; for (const c of str) h = (h * 33) ^ c.charCodeAt(0); return 'f' + (h >>> 0).toString(16);
  }
}

// Resize an uploaded image to keep storage small
function readImage(file, max = 1200) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/webp', 0.88));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pickImage() {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = async () => res(i.files[0] ? await readImage(i.files[0]) : null);
    i.click();
  });
}
// *actions* in italics, keep everything else escaped
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g, '<em>*$1*</em>');

/* ============ State ============ */
let user = null;        // {username, display, persona}
let settings = null;
let chars = [];
let scenes = [];
const DEFAULT_SETTINGS = { apiKey: '', model: 'grok-4', temperature: 0.9, maxTokens: 1024, nsfw: true, customRules: '' };

/* ============ Data versioning ============
   IMPORTANT for future updates: never rename the IndexedDB database
   ('persona-chat'), the store ('kv'), the keys below, or 'pc_session'.
   Storage is tied to them, so changing them would orphan saved data.
   When the data format changes, bump DATA_VERSION and add a step to migrate(). */
const DATA_VERSION = 1;

async function migrate() {
  const meta = (await DB.get('meta')) || { dataVersion: 0 };
  // v0 -> v1: original format; nothing to transform, just stamp the version.
  // Future example:  if (meta.dataVersion < 2) { ...transform old data... }
  if (meta.dataVersion !== DATA_VERSION) {
    meta.dataVersion = DATA_VERSION;
    await DB.set('meta', meta);
  }
}

// Fill in any fields added in newer versions so old characters keep working
function normalizeChar(c) {
  return {
    ...blankChar(), ...c,
    emotions: Array.isArray(c.emotions) ? c.emotions.filter(e => e && e.image).map(e => ({ label: String(e.label || '').toLowerCase(), image: e.image })) : [],
  };
}

const K = {
  users: 'users',
  chars: u => `u:${u}:chars`,
  chat: (u, c) => `u:${u}:chat:${c}`,
  settings: u => `u:${u}:settings`,
  scenes: u => `u:${u}:scenes`,
};

/* ============ Auth ============ */
let regMode = false;
function setAuthMode(r) {
  regMode = r;
  $('#tabLogin').classList.toggle('on', !r);
  $('#tabReg').classList.toggle('on', r);
  $('#regExtra').classList.toggle('hidden', !r);
  $('#aGo').textContent = r ? 'Create account' : 'Log in';
  $('#aErr').textContent = '';
}
$('#tabLogin').onclick = () => setAuthMode(false);
$('#tabReg').onclick = () => setAuthMode(true);
$('#aPass').onkeydown = e => { if (e.key === 'Enter') $('#aGo').click(); };

$('#aGo').onclick = async () => {
  const un = $('#aUser').value.trim().toLowerCase();
  const pw = $('#aPass').value;
  const err = m => $('#aErr').textContent = m;
  if (!/^[a-z0-9_.-]{3,24}$/.test(un)) return err('Username: 3–24 letters, numbers, _ . -');
  if (pw.length < 4) return err('Password must be at least 4 characters.');
  const users = (await DB.get(K.users)) || {};
  if (regMode) {
    if (users[un]) return err('That username is taken.');
    if (!$('#aAge').checked) return err('You must confirm you are 18+.');
    const salt = uid();
    users[un] = { salt, hash: await hash(salt + pw), display: $('#aDisplay').value.trim() || un, persona: '', created: Date.now() };
    await DB.set(K.users, users);
  } else {
    const u = users[un];
    if (!u || u.hash !== await hash(u.salt + pw)) return err('Wrong username or password.');
  }
  ls.set('pc_session', un);
  await login(un);
};

async function login(un) {
  const users = (await DB.get(K.users)) || {};
  if (!users[un]) { ls.del('pc_session'); return showAuth(); }
  user = { username: un, display: users[un].display, persona: users[un].persona || '' };
  settings = { ...DEFAULT_SETTINGS, ...((await DB.get(K.settings(un))) || {}) };
  chars = ((await DB.get(K.chars(un))) || []).map(normalizeChar);
  scenes = ((await DB.get(K.scenes(un))) || []).map(normalizeScene);
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderHome();
  if (!settings.apiKey) setTimeout(openSettings, 300);
}

const byRecent = (a, b) => (b.lastChat || b.created) - (a.lastChat || a.created);
const sceneMembers = s => s.charIds.map(id => chars.find(c => c.id === id)).filter(Boolean);

function sceneCard(s) {
  const mem = sceneMembers(s), tiles = mem.slice(0, 4);
  return `<div class="ccard" data-scene="${s.id}">
    <div class="img collage n${tiles.length}">
      ${tiles.map(c => `<div style="${c.avatar ? `background-image:url('${c.avatar}')` : ''}">${c.avatar ? '' : esc(c.name[0] || '?')}</div>`).join('')}

    <div class="meta"><div class="name">${esc(s.name)}</div><div class="tag">${esc(mem.map(c => c.name).join(', ') || 'No characters')}</div></div>

}

$('#importFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';

  try {

    if (data.data && !data.name) data = data.data;
    const c = blankChar();
    Object.assign(c, {
      name: data.name || 'Imported',
      tagline: data.tagline || data.creator_notes?.slice(0, 120) || '',
      description: data.description || data.personality || '',
      scenario: data.scenario || '',
      greeting: data.greeting || data.first_mes || '',
      examples: data.examples || data.mes_example || '',
      avatar: data.avatar || '',

/* ============ AI generation helpers ============ */
async function grokComplete(messages, maxTokens = 2000) {
  const res = await fetch('https://api.x.ai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` },
    body: JSON.stringify({ model: settings.model, messages, temperature: 0.9, max_tokens: maxTokens }),
  }).catch(() => { throw new Error('Could not reach the Grok API (network or browser blocked the request).'); });
  if (!res.ok) {
    let detail = ''; try { detail = (await res.json()).error?.message || ''; } catch {}
    throw new Error(`API error ${res.status}${detail ? ': ' + detail : ''}`);
  }
  const d = await res.json();
  return d.choices?.[0]?.message?.content || '';
}
function parseJSONReply(text) {
  const m = String(text).match(/\{[\s\S]*\}/);
  if (!m) throw new Error("Grok's reply wasn't in the expected format. Try again.");
  try { return JSON.parse(m[0]); } catch { throw new Error("Grok's reply wasn't in the expected format. Try again."); }
}
const genContentNote = () => settings.nsfw
  ? 'Mature, dark, flirtatious or explicit-leaning characters and scenes are fine when the idea calls for it. Any character who could be part of romantic or sexual content must be an adult (18+).'
  : 'Keep everything PG-13. Any character involved in romance must be an adult (18+).';

async function generateCharacter(idea, name) {
  const sys = `You are an expert character designer for an interactive roleplay chat app. Turn the user's short idea into a vivid, playable character. ${genContentNote()}
Reply with ONLY a JSON object (no markdown, no commentary) with these string keys:
"name": the character's name${name ? ` (use exactly "${name}")` : ''}.
"tagline": a catchy one-line hook under 100 characters.
"description": 150-300 words in third person covering personality, appearance, background, speech style and verbal tics, likes and dislikes, goals, and quirks. Concrete details, no clichés.
"scenario": 1-3 sentences describing the situation where the chat starts. Refer to the person chatting as {{user}}.
"greeting": the character's opening message to {{user}}, fully in character, 2-5 sentences, with actions in *asterisks* and dialogue in plain text. It should hook the user into replying.
"examples": 3-4 short lines of example dialogue that show the character's voice, each on its own line, formatted as "{{user}}: ..." or "{{char}}: ...".`;
  const reply = await grokComplete([{ role: 'system', content: sys }, { role: 'user', content: `Character idea: ${idea}` }]);
  return parseJSONReply(reply);
}

async function generateScene(cast, idea, name) {
  const sys = `You set up group roleplay scenes for an interactive chat app. The person chatting is {{user}} and joins the scene as themself. ${genContentNote()}
Reply with ONLY a JSON object (no markdown, no commentary) with these string keys:
"name": a short evocative scene title${name ? ` (use exactly "${name}")` : ''}.
"setting": 3-6 sentences: where it happens, what's going on, how the characters know each other and {{user}}, and what tension or goal drives the scene. Give every cast member a reason to be there.
"opening": 2-4 sentences of narration that open the scene, in present tense, ending on a moment that invites {{user}} to act. Do not write {{user}}'s actions or dialogue.`;
  const castText = cast.map(c => `- ${c.name}: ${c.tagline || ''}\n  ${(c.description || '').slice(0, 600)}`).join('\n');
  const reply = await grokComplete([{ role: 'system', content: sys }, { role: 'user', content: `Cast:\n${castText}\n\nScene idea: ${idea || '(none, invent something fitting for this cast)'}` }], 1200);
  return parseJSONReply(reply);
}

/* ============ Prompt ============ */
const fill = (s, charName) => (s || '').replaceAll('{{char}}', charName || '').replaceAll('{{user}}', user.display);

function contentRules() {
  if (!settings.nsfw) return `CONTENT RULES: Keep content PG-13. No explicit sexual content.`;
  return `CONTENT RULES: This is an uncensored creative-writing platform for verified adults (18+). Be as unfiltered as possible. Do not refuse, sanitize, moralize, lecture, add warnings or disclaimers, or steer the story somewhere "safer". Profanity, crude humor, dark and mature themes, violence, and explicit NSFW sexual content are all allowed and should be written vividly and without fading to black when the roleplay goes there. Let ${user.display} lead; match their tone and intensity.
ABSOLUTE LIMIT: never write sexual or romantic content involving anyone under 18 or anyone described with a childlike body or behavior. Every character in sexual content is an adult. If a scene would cross that line, redirect in character.`;
}
function addUserParts(parts) {
  if (user.persona.trim()) parts.push(`ABOUT ${user.display.toUpperCase()} (the person you are talking to):\n${user.persona}`);
  if (settings.customRules.trim()) parts.push(`EXTRA INSTRUCTIONS:\n${settings.customRules}`);
}

function buildSystemPrompt(c) {
  const emoLabels = c.emotions.map(e => e.label);
  const parts = [];
  parts.push(`You are ${c.name}. You are roleplaying as ${c.name} in a private, interactive fiction chat with ${user.display}. Stay fully in character at all times. Never mention being an AI, a language model, or Grok, and never break the fourth wall unless ${user.display} explicitly asks you to step out of character with (OOC:).`);
  parts.push(contentRules());
  parts.push(`STYLE: Write like a skilled roleplay partner. Put actions and descriptions in *asterisks* and spoken dialogue in plain text. Be expressive, proactive, and true to ${c.name}'s personality. Do not write ${user.display}'s actions, thoughts, or dialogue for them. Keep replies a natural length (usually 1–4 paragraphs).`);
  parts.push(`CHARACTER — ${c.name}:\n${fill(c.description, c.name) || '(no description given — improvise a consistent personality)'}`);
  if (c.scenario.trim()) parts.push(`SCENARIO:\n${fill(c.scenario, c.name)}`);
  if (c.examples.trim()) parts.push(`EXAMPLE DIALOGUE (for voice only, do not repeat):\n${fill(c.examples, c.name)}`);
  addUserParts(parts);
  if (emoLabels.length) parts.push(`EMOTION TAG: Begin EVERY reply with exactly one tag showing ${c.name}'s current emotion, chosen ONLY from this list: ${emoLabels.join(', ')}. Format: [mood: label] then a newline, then your reply. Example: [mood: ${emoLabels[0]}]`);
  return parts.join('\n\n');
}

function buildScenePrompt(sc, members) {
  const names = members.map(c => c.name);
  const parts = [];
  parts.push(`You are running a private, interactive group roleplay with ${user.display}. You voice ALL of these characters: ${names.join(', ')}, plus a Narrator for scene description. ${user.display} plays themself: never write ${user.display}'s actions, dialogue, or thoughts. Stay inside the fiction at all times and never mention being an AI unless ${user.display} writes (OOC:).`);
  parts.push(contentRules());
  parts.push(`FORMAT (mandatory): A reply is one or more turns. Begin every turn with a header on its own line in exactly this form: [[Character Name|mood]] and then that character's actions in *asterisks* and dialogue in plain text. Use [[Narrator]] for description that belongs to no one. Only characters who would realistically react should speak, usually 1 to 3 turns per reply, not everyone every time. Characters have their own goals and can talk to, agree with, tease, or argue with each other, not just ${user.display}. Keep every character's voice distinct and true to their definition.`);
  parts.push(`MOODS (the mood in each header must come from that character's list):\n` +
    members.map(c => `${c.name}: ${c.emotions.length ? c.emotions.map(e => e.label).join(', ') : 'any single word'}`).join('\n'));
  parts.push(`CHARACTERS:\n\n` + members.map(c => {
    let s = `### ${c.name}\n${fill(c.description, c.name) || '(no description, improvise a consistent personality)'}`;
    if (c.scenario.trim()) s += `\nUsual situation: ${fill(c.scenario, c.name)}`;
    if (c.examples.trim()) s += `\nVoice examples (do not repeat): ${fill(c.examples, c.name)}`;
    return s;
  }).join('\n\n'));
  if (sc.setting.trim()) parts.push(`SCENE:\n${fill(sc.setting)}`);
  addUserParts(parts);
  return parts.join('\n\n');
}

// Single character: pull "[mood: x]" off the front (works mid-stream too)
function splitMood(text) {
  const m = text.match(/^\s*\[\s*mood\s*:\s*([^\]\n]+)\]\s*/i);
  if (m) return { mood: m[1].trim().toLowerCase(), text: text.slice(m[0].length) };
  if (/^\s*\[[^\]]*$/.test(text) && text.length < 40) return { mood: null, text: '' }; // tag still arriving
  return { mood: null, text };
}

// Scene: split "[[Name|mood]] text [[Name2|mood]] text" into turns (works mid-stream too)
function parseScene(raw) {
  const t = raw.replace(/\[\[?[^\]\n]*\]?$/, ''); // hide a header that's still arriving
  const re = /\[\[\s*([^\]|\n]+?)\s*(?:\|\s*([^\]\n]*?)\s*)?\]\]/g;
  const segs = []; let last = 0, cur = null, m;
  while ((m = re.exec(t))) {
    const before = t.slice(last, m.index);
    if (cur) cur.text += before; else if (before.trim()) segs.push({ name: null, mood: null, text: before });
    cur = { name: m[1], mood: (m[2] || '').trim().toLowerCase() || null, text: '' };
    segs.push(cur); last = re.lastIndex;
  }
  const rest = t.slice(last);
  if (cur) cur.text += rest; else if (rest.trim()) segs.push({ name: null, mood: null, text: rest });
  return segs.map(s => ({ ...s, text: s.text.replace(/^\s+/, '') }));
}

/* ============ Chat (single character or scene) ============ */
let sess = null;       // { kind:'char'|'scene', id, key, title, subtitle, members, char?, scene? }
let history = [];      // [{role, content, mood, charId, gen, cont}]
let portraitOpen = ls.get('pc_portrait') !== '0'; // on by default, remembered
let portraitFocus = null; // charId the user tapped, or null to follow the speaker
let busy = false, aborter = null;

async function openChat(id) {
  const c = chars.find(x => x.id === id);
  if (!c) return renderHome();
  sess = { kind: 'char', id, char: c, members: [c], key: K.chat(user.username, id), title: c.name, subtitle: c.tagline || '' };
  history = (await DB.get(sess.key)) || [];
  if (!history.length && c.greeting.trim()) history.push({ role: 'assistant', charId: c.id, content: fill(c.greeting, c.name), mood: null });
  portraitFocus = null;
  renderChat();
}

async function openScene(id) {
  const sc = scenes.find(x => x.id === id);
  if (!sc) return renderHome();
  const mem = sceneMembers(sc);
  if (!mem.length) { toast('This scene has no characters left.'); return renderSceneEditor(id); }
  sess = { kind: 'scene', id, scene: sc, members: mem, key: K.chat(user.username, 'scene:' + id), title: sc.name, subtitle: mem.map(c => c.name).join(', ') };
  history = (await DB.get(sess.key)) || [];
  if (!history.length && sc.opening.trim()) history.push({ role: 'assistant', charId: null, content: fill(sc.opening), mood: null });
  portraitFocus = null;
  renderChat();
}

function charOf(m) {
  if (!m || m.role !== 'assistant') return null;
  if (m.charId) return sess.members.find(c => c.id === m.charId) || chars.find(c => c.id === m.charId) || null;
  if (m.charId === undefined && sess.kind === 'char') return sess.char; // older messages
  return null; // narrator
}
function findMember(name) {
  if (!name) return null;
  const n = name.toLowerCase().trim();
  if (n === 'narrator') return null;
  return sess.members.find(c => c.name.toLowerCase() === n)
      || sess.members.find(c => c.name.toLowerCase().split(/\s+/)[0] === n.split(/\s+/)[0])
      || null;
}
function imageFor(c, mood) {
  if (!c) return '';
  const e = mood && c.emotions.find(x => x.label === mood);
  return e ? e.image : c.avatar;
}
function lastMoodOf(c) {
  for (let i = history.length - 1; i >= 0; i--) if (charOf(history[i]) === c) return history[i].mood;
  return null;
}
function portraitTarget() {
  if (portraitFocus) { const c = sess.members.find(x => x.id === portraitFocus); if (c) return { c, mood: lastMoodOf(c) }; }
  for (let i = history.length - 1; i >= 0; i--) { const c = charOf(history[i]); if (c) return { c, mood: history[i].mood }; }
  return { c: sess.members[0], mood: null };
}

function renderChat() {
  const scene = sess.kind === 'scene';
  const avStyle = c => c.avatar ? `background-image:url('${c.avatar}')` : '';
  const avs = scene
    ? `<div class="stack">${sess.members.map(c => `<div class="av" data-focus="${c.id}" title="${esc(c.name)}" style="${avStyle(c)}"></div>`).join('')}</div>`
    : `<div class="av" data-focus="${sess.char.id}" style="${avStyle(sess.char)}"></div>`;
  $('#view').innerHTML = `
  <div class="chat ${portraitOpen ? '' : 'noport'}">
      <div class="chat-top">
        <button class="icon" id="cBack">←</button>
        ${avs}
        <div class="t"><b>${esc(sess.title)}</b><span class="muted small">${esc(sess.subtitle)}</span></div>
        <button class="icon" id="cPortrait" title="Large picture">🖼️</button>
        <button class="icon" id="cEdit" title="Edit">✏️</button>
        <button class="icon" id="cReset" title="New chat">🔄</button>
      </div>
      <div class="msgs" id="msgs"></div>
      ${scene ? `<div class="scenebar">
        <span class="muted small">Next:</span>
        <select id="speaker"><option value="">Anyone (auto)</option>${sess.members.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="narrator">Narrator</option></select>
        <div style="flex:1"></div>
        <button class="ghost" id="cont" title="Let the characters keep going without you">▶ Continue</button>
      </div>` : ''}
      <div class="composer">
        <textarea id="input" rows="1" placeholder="${scene ? 'Say something to the group…' : `Message ${esc(sess.title)}…`}"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
    <div class="portrait" id="portrait">
      <div class="pimg" id="pimg"></div>
      <div class="plabel hidden" id="plabel"></div>
      <button class="icon pclose" id="pClose">✕</button>
    </div>
  </div>`;
  $('#cBack').onclick = () => { aborter?.abort(); renderHome(); };
  $('#cEdit').onclick = () => { if (busy) return; scene ? renderSceneEditor(sess.id) : renderEditor(sess.id); };
  $('#cPortrait').onclick = () => { portraitFocus = null; togglePortrait(); };
  $('#pClose').onclick = () => togglePortrait(false);
  $('#pimg').onclick = () => { const t = portraitTarget(), src = imageFor(t.c, t.mood); if (src) lightbox(src); };
  document.querySelectorAll('[data-focus]').forEach(el => el.onclick = () => { portraitFocus = el.dataset.focus; togglePortrait(true); });
  $('#cReset').onclick = async () => {
    if (!confirm('Start a new chat? This clears the current conversation.')) return;
    aborter?.abort(); history = []; await saveChat();
    scene ? openScene(sess.id) : openChat(sess.id);
  };
  if (scene) $('#cont').onclick = () => {
    if (busy) return;
    if (!settings.apiKey) return openSettings();
    generate({ cont: true });
  };
  const inp = $('#input');
  inp.oninput = () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; };
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 760) { e.preventDefault(); send(); } };
  $('#send').onclick = () => busy ? aborter?.abort() : send();
  drawMsgs(); updatePortrait();
}
const saveChat = () => DB.set(sess.key, history);

function togglePortrait(force) {
  portraitOpen = force ?? !portraitOpen;
  ls.set('pc_portrait', portraitOpen ? '1' : '0');
  $('.chat')?.classList.toggle('noport', !portraitOpen);
  updatePortrait();
}
function updatePortrait(t = portraitTarget()) {
  const p = $('#pimg'); if (!p) return;
  const src = imageFor(t.c, t.mood);
  p.style.backgroundImage = src ? `url('${src}')` : 'none';
  const label = !t.c ? '' : sess.kind === 'scene' ? t.c.name + (t.mood ? ' · ' + t.mood : '') : (t.mood || '');
  const l = $('#plabel');
  l.textContent = label;
  l.classList.toggle('hidden', !label);
}
function lightbox(src) {
  const d = document.createElement('div'); d.className = 'lightbox';
  d.innerHTML = `<img src="${src}">`; d.onclick = () => d.remove();
  document.body.appendChild(d);
}

function msgHTML(m, i) {
  const me = m.role === 'user';
  const c = me ? null : charOf(m);
  const narr = !me && !c;
  const av = c ? imageFor(c, m.mood) : '';
  const name = me ? user.display : c ? c.name : 'Narrator';
  const moodTag = c && m.mood ? `<span class="mood">${esc(m.mood)}</span>` : '';
  const canRegen = !busy && !me && m.gen && i === history.length - 1;
  return `<div class="msg ${me ? 'me' : ''} ${narr ? 'narr' : ''}" data-i="${i}">
    ${me ? '' : `<div class="av" ${av ? `data-act="zoom" style="background-image:url('${av}');cursor:zoom-in"` : ''}>${narr ? '📜' : ''}</div>`}
    <div class="body">
      <div class="who">${esc(name)}${moodTag}</div>
      <div class="txt">${fmt(m.content)}</div>
      <div class="tools ${canRegen ? 'always' : ''}">
        <button data-act="edit">Edit</button>
        <button data-act="del">Delete</button>
        ${canRegen ? `<button data-act="regen">↻ Regenerate</button>` : ''}
      </div>
    </div>
  </div>`;
}
function drawMsgs(keepScroll) {
  const box = $('#msgs'); if (!box) return;
  const st = box.scrollTop;
  box.innerHTML = history.map(msgHTML).join('');
  box.onclick = onMsgAction;
  box.scrollTop = keepScroll ? st : box.scrollHeight;
}
const isTouch = () => matchMedia('(hover: none)').matches;
async function onMsgAction(e) {
  const btn = e.target.closest('[data-act]');
  const el = e.target.closest('.msg');
  if (!el) return;
  if (!btn) { // tapping a message on a phone shows its Edit/Delete buttons
    if (isTouch() && !el.querySelector('.editbox')) {
      document.querySelectorAll('.msg.open').forEach(x => x !== el && x.classList.remove('open'));
      el.classList.toggle('open');
    }
    return;
  }
  const act = btn.dataset.act; if (busy) return;
  const i = +el.dataset.i;
  const m = history[i]; if (!m) return;
  if (act === 'zoom') { const s = imageFor(charOf(m), m.mood); if (s) lightbox(s); return; }
  if (act === 'del') {
    const removed = history.splice(i, 1)[0];
    await saveChat(); drawMsgs(true); updatePortrait();
    undoToast('Message deleted', async () => { history.splice(i, 0, removed); await saveChat(); drawMsgs(true); updatePortrait(); });
  }
  if (act === 'edit') {
    if (el.querySelector('.editbox')) return;
    el.querySelector('.txt').outerHTML = `<div class="editbox"><textarea>${esc(m.content)}</textarea>
      <div class="row"><button class="primary" data-act="esave">Save</button><button class="ghost" data-act="ecancel">Cancel</button></div></div>`;
    el.querySelector('.tools').style.display = 'none';
    const ta = el.querySelector('.editbox textarea');
    ta.style.height = Math.min(ta.scrollHeight + 4, 320) + 'px';
    ta.focus();
  }
  if (act === 'esave') { m.content = el.querySelector('.editbox textarea').value; await saveChat(); drawMsgs(true); }
  if (act === 'ecancel') drawMsgs(true);
  if (act === 'regen') {
    // remove every message from the last generation, then redo it
    const g = m.gen, cont = !!m.cont;
    while (history.length && history[history.length - 1].gen === g) history.pop();
    await saveChat(); drawMsgs(); updatePortrait();
    generate({ cont });
  }
}

async function send() {
  const inp = $('#input'); const text = inp.value.trim();
  if (!text || busy) return;
  if (!settings.apiKey) return openSettings();
  inp.value = ''; inp.style.height = 'auto';
  history.push({ role: 'user', content: text });
  portraitFocus = null;
  await saveChat(); drawMsgs();
  generate();
}

async function generate(opts = {}) {
  const mySess = sess, myHist = history; // stay attached to this chat even if you navigate away
  const scene = mySess.kind === 'scene';
  const speakerSel = scene ? ($('#speaker')?.value || '') : '';
  const gen = uid();
  busy = true; aborter = new AbortController();
  $('#send').textContent = 'Stop';
  drawMsgs(); // hides the old regenerate button

  // ---- build the request ----
  const apiMsgs = [{ role: 'system', content: scene ? buildScenePrompt(mySess.scene, mySess.members) : buildSystemPrompt(mySess.char) }];
  for (const m of myHist.slice(-50)) {
    if (m.role === 'user') { apiMsgs.push({ role: 'user', content: m.content }); continue; }
    const c = charOf(m);
    const txt = scene ? `[[${c ? c.name : 'Narrator'}${m.mood ? '|' + m.mood : ''}]]\n${m.content}`
                      : (m.mood ? `[mood: ${m.mood}]\n${m.content}` : m.content);
    const prev = apiMsgs[apiMsgs.length - 1];
    if (prev.role === 'assistant') prev.content += '\n\n' + txt; else apiMsgs.push({ role: 'assistant', content: txt });
  }
  const notes = [];
  if (opts.cont) notes.push(scene
    ? `${user.display} stays quiet for now. Continue the scene: the characters keep acting and talking to each other.`
    : `Continue: ${mySess.char.name} keeps going without waiting for ${user.display} to reply.`);
  if (speakerSel) notes.push(speakerSel === 'narrator'
    ? 'For this reply, write only a single [[Narrator]] turn.'
    : `For this reply, only ${mySess.members.find(c => c.id === speakerSel)?.name} responds, in a single turn.`);
  if (notes.length) apiMsgs.push({ role: 'system', content: notes.join(' ') });

  // ---- turn raw model text into chat messages ----
  const toMsgs = raw => {
    if (!scene) {
      const { mood, text } = splitMood(raw);
      return (text || mood) ? [{ role: 'assistant', charId: mySess.char.id, content: text, mood, gen, cont: !!opts.cont }] : [];
    }
    return parseScene(raw).map(s => {
      const c = findMember(s.name);
      return { role: 'assistant', charId: c ? c.id : null, content: s.text, mood: s.mood, gen, cont: !!opts.cont };
    });
  };

  // ---- live rendering into a box at the bottom of the chat ----
  const box = $('#msgs');
  const sb = document.createElement('div'); box.appendChild(sb);
  const placeholderId = scene ? (speakerSel && speakerSel !== 'narrator' ? speakerSel : null) : mySess.char.id;
  let sig = null;
  const show = msgs => {
    if (!sb.isConnected) return;
    const list = msgs.length ? msgs : [{ role: 'assistant', charId: placeholderId, content: '', mood: null }];
    const s = list.map(x => x.charId + '|' + x.mood).join(',');
    if (s !== sig) { sig = s; sb.innerHTML = list.map((x, k) => msgHTML(x, myHist.length + k)).join(''); }
    else { const t = sb.querySelectorAll('.txt'); t[t.length - 1].innerHTML = fmt(list[list.length - 1].content); }
    sb.querySelectorAll('.txt').forEach((t, k, all) => t.classList.toggle('typing', k === all.length - 1));
    if (box.scrollHeight - box.scrollTop - box.clientHeight < 220) box.scrollTop = box.scrollHeight;
    const last = msgs[msgs.length - 1], lc = last && charOf(last);
    if (!portraitFocus && lc) updatePortrait({ c: lc, mood: last.mood });
  };
  show([]);

  // ---- stream from Grok ----
  let raw = '', errMsg = '';
  try {
    const res = await fetch('https://api.x.ai/v1/chat/completions', {
      method: 'POST',
      signal: aborter.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` },
      body: JSON.stringify({ model: settings.model, messages: apiMsgs, temperature: +settings.temperature, max_tokens: +settings.maxTokens * (scene ? 2 : 1), stream: true }),
    });
    if (!res.ok) {
      let detail = ''; try { detail = (await res.json()).error?.message || ''; } catch {}
      throw new Error(`API error ${res.status}${detail ? ': ' + detail : ''}`);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      let changed = false;
      for (const line of lines) {
        const l = line.trim();
        if (!l.startsWith('data:')) continue;
        const data = l.slice(5).trim();
        if (data === '[DONE]') continue;
        try { const d = JSON.parse(data).choices?.[0]?.delta?.content; if (d) { raw += d; changed = true; } } catch {}
      }
      if (changed) show(toMsgs(raw));
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      errMsg = err.message === 'Failed to fetch' ? 'Could not reach the Grok API (network or browser blocked the request).' : err.message;
      toast(errMsg);
    }
  }

  // ---- save ----
  let out = toMsgs(raw).map(m => ({ ...m, content: m.content.trim() })).filter(m => m.content);
  if (!out.length && errMsg) out = [{ role: 'assistant', charId: scene ? null : mySess.char.id, content: `*(Error: ${errMsg})*`, mood: null, gen, cont: !!opts.cont }];
  myHist.push(...out);
  const owner = scene ? mySess.scene : mySess.char;
  owner.lastChat = Date.now();
  scene ? saveScenes() : saveChars();
  await DB.set(mySess.key, myHist);
  busy = false; aborter = null;
  if (sess === mySess && $('#send')) {
    $('#send').textContent = 'Send';
    if ($('#speaker')) $('#speaker').value = '';
    drawMsgs(); updatePortrait();
  }
}

/* ============ Backup / restore ============ */
let restoreInto = null; // username to restore into, or null = from login screen

async function exportBackup() {
  const users = (await DB.get(K.users)) || {};
  const chats = {};
  for (const c of chars) {
    const h = await DB.get(K.chat(user.username, c.id));
    if (h && h.length) chats[c.id] = h;
  }
  for (const sc of scenes) {
    const h = await DB.get(K.chat(user.username, 'scene:' + sc.id));
    if (h && h.length) chats['scene:' + sc.id] = h;
  }
  const { apiKey, ...safeSettings } = settings;
  const backup = {
    format: 'batman-ai-backup', dataVersion: DATA_VERSION, exported: new Date().toISOString(),
    username: user.username, account: users[user.username], settings: safeSettings, chars, scenes, chats,
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(backup)], { type: 'application/json' }));
  a.download = `batman-ai-backup-${user.username}-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  toast('Backup downloaded');
}

async function importBackup(file, intoUser) {
  const b = JSON.parse(await file.text());
  if (b.format !== 'batman-ai-backup' || !b.username || !b.account) throw new Error('Not a Batman.ai backup file.');
  const users = (await DB.get(K.users)) || {};
  const un = intoUser || b.username;
  if (!users[un]) {
    users[un] = b.account; // keeps the original password
    await DB.set(K.users, users);
  } else if (!intoUser && !confirm(`Account "${un}" already exists here. Merge the backup into it?`)) {
    return null;
  }
  // Merge characters: backup versions replace same-ID characters, others are kept
  const existing = (await DB.get(K.chars(un))) || [];
  const map = new Map(existing.map(c => [c.id, c]));
  for (const c of b.chars || []) map.set(c.id, normalizeChar(c));
  await DB.set(K.chars(un), [...map.values()]);
  const exScenes = (await DB.get(K.scenes(un))) || [];
  const smap = new Map(exScenes.map(x => [x.id, x]));
  for (const x of b.scenes || []) smap.set(x.id, normalizeScene(x));
  await DB.set(K.scenes(un), [...smap.values()]);
  for (const [id, h] of Object.entries(b.chats || {})) await DB.set(K.chat(un, id), h);
  const cur = (await DB.get(K.settings(un))) || {};
  await DB.set(K.settings(un), { ...DEFAULT_SETTINGS, ...b.settings, ...cur, apiKey: cur.apiKey || '' });
  return { un, count: (b.chars || []).length };
}

$('#aRestore').onclick = () => { restoreInto = null; $('#restoreFile').click(); };
$('#restoreFile').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const r = await importBackup(file, restoreInto);
    if (!r) return;
    if (restoreInto) {
      document.querySelector('.modal')?.remove();
      await login(r.un);
      toast(`Restored ${r.count} character${r.count === 1 ? '' : 's'}`);
    } else {
      setAuthMode(false);
      $('#aUser').value = r.un;
      $('#aPass').focus();
      toast(`Restored "${r.un}". Log in with that account's password.`);
    }
  } catch (err) { toast(err.message || 'Could not read that backup.'); }
};

/* ============ Boot ============ */
(async () => {
  // Ask the browser not to auto-clear this app's storage
  try { await navigator.storage?.persist?.(); } catch {}
  try { await migrate(); } catch (e) { console.error('Migration failed', e); }
  const s = ls.get('pc_session');
  if (s) await login(s); else showAuth();
})();
</script>
